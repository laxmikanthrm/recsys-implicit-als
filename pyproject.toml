[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys-implicit-als"
version = "0.1.0"
description = "Implicit-feedback recommender (ALS) built from scratch with NumPy, compared against popularity and item-kNN baselines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["recsys"]
